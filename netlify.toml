[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20.18.0"
  NPM_FLAGS = "--no-audit --no-fund"

# Let the frontend call one platform-neutral path (/api/gemini-proxy) on
# both Netlify and Cloudflare Pages; Netlify rewrites it to its function.
[[redirects]]
  from = "/api/gemini-proxy"
  to = "/.netlify/functions/gemini-proxy"
  status = 200
  force = true

# CORS for the proxy is set dynamically inside the function itself
# (origin-checked against TRUSTED_ORIGINS), so it is NOT duplicated here
# as a static "*" header — a static wildcard here would override the
# function's own origin check and re-open the proxy to any site.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
